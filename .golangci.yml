# golangci-lint v2 configuration for terraform-provider-wallix-bastion
# Migrated from the v1 schema via `golangci-lint migrate` (golangci-lint-action@v9 requires v2+).
# See https://golangci-lint.run/docs/product/migration-guide for the v1 -> v2 mapping.

version: "2"
run:
  tests: true
linters:
  default: all
  disable:
    - canonicalheader  # Allow non-canonical header names (some APIs require specific casing)
    - cyclop
    - depguard
    - dupl
    - err113
    - exhaustruct     # Deprecated in v2 but still selectable; disable alongside exhaustruct_v5
    - exhaustruct_v5  # v2's rewrite of `exhaustruct`; same reason for disabling as before
    - forcetypeassert
    - funlen
    - gomoddirectives
    - goconst         # v2 scores repeated strings package-wide instead of per-file, surfacing
                      # ~190 pre-existing cross-file dupes at once; tracked as a follow-up
                      # instead of blocking this migration - see issue #103
    - mnd
    - modernize     # New in v2; too aggressive/noisy for this codebase's existing style
    - nestif
    - noctx           # Allow http.Get/NewRequest without context in tests
    - noinlineerr   # New in v2; flags the `if err := f(); err != nil` idiom used throughout
    - paralleltest
    - tagliatelle
    - testpackage     # Allow tests in same package for internal testing
    - usetesting      # Allow os.Setenv in tests (not all tests can use t.Setenv)
    - varnamelen
    - wsl             # Deprecated in v2 but still selectable; disable alongside wsl_v5
    - wsl_v5        # v2's rewrite of `wsl`; same reason for disabling as before
  settings:
    gocognit:
      # Increase threshold - complex API clients are expected
      min-complexity: 40
    goconst:
      # Only flag strings that appear 5+ times (not 3)
      min-occurrences: 5
    gocyclo:
      # Increase threshold - complex API clients are expected
      min-complexity: 40
    gosec:
      # Exclude specific rules that are false positives
      excludes:
        - G101  # Hardcoded credentials (false positive for header names)
        - G402  # TLS InsecureSkipVerify (intentional for development)
    govet:
      disable:
        - fieldalignment
      enable-all: true
    unparam:
      # Allow functions that always return nil error (may change in future)
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - gocognit
          - gocyclo
          - godoclint
          - gosec
          - noctx
          - testpackage
          - usetesting
      # Exclude examples and third party code
      - path: examples/
        linters:
          - all
      - path: third_party/
        linters:
          - all
      # Specific exclusions for known false positives
      - text: "csrfTokenHeader.*canonical"
        linters:
          - canonicalheader
      - text: "G101.*csrfTokenHeader"
        linters:
          - gosec
      - text: "G402.*InsecureSkipVerify"
        linters:
          - gosec
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0
  # Maximum count of issues with the same text
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/wallix/terraform-provider-wallix-bastion)
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
