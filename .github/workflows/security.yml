---
name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Dependency vulnerabilities
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      
      # Run with the Go installed above from go.mod (its toolchain directive), the one the release is
      # built with. golang/govulncheck-action sets go-version to "stable" by default, which wins over
      # go-version-file: it scanned the standard library of the latest Go and missed the
      # vulnerabilities of the release toolchain.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # osv-scanner v2: the v1 command left an empty osv-results.sarif in CI, so the upload failed
      # and the following scans were skipped, hidden by continue-on-error. It exits 1 when it finds
      # vulnerabilities, which the upload below reports; any other non-zero exit is a scanner
      # failure, which now fails the job.
      - name: Run OSV Scanner (dependency vulnerability scanner)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          osv-scanner scan source -r --format sarif --output-file osv-results.sarif ./ || [ $? -eq 1 ]

      - name: Upload OSV scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'osv-results.sarif'
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true  # Don't fail the job on vulnerabilities, just report them
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
  
  # Container security (if using Docker)
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Build test container
        run: |
          cat > Dockerfile.test << 'EOF'
          FROM golang:1.26-alpine AS builder
          WORKDIR /app
          COPY go.mod go.sum ./
          RUN go mod download
          COPY . .
          RUN CGO_ENABLED=0 go build -o terraform-provider-wallix-bastion
          
          FROM alpine:latest
          RUN apk --no-cache add ca-certificates
          WORKDIR /root/
          COPY --from=builder /app/terraform-provider-wallix-bastion .
          CMD ["./terraform-provider-wallix-bastion"]
          EOF
          
          docker build -f Dockerfile.test -t wallix-bastion-provider:test .
        continue-on-error: false
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wallix-bastion-provider:test'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'
