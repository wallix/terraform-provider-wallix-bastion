name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  # Go linting
  golangci-lint:
    name: Go Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod
      
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config .golangci.yml --verbose --timeout 5m
          skip-cache: false  # Enable caching for better performance
  
  # Terraform formatting
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
      
      - name: Check Terraform formatting in examples
        run: terraform fmt -check -diff -recursive examples
      
      - name: Check HCL formatting in test files
        run: |
          find . -name "*_test.go" -exec grep -l "testAccResourceConfig" {} \; | \
          xargs grep -oh 'resource "[^"]*" "[^"]*"' | \
          sort -u > /tmp/terraform_blocks.txt || true
  
  # Documentation linting
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/.terraform/**
      
      # Temporarily disabled due to network issues causing dead link failures
      # - name: Check broken links
      #   uses: gaurav-nelson/github-action-markdown-link-check@v1
      #   with:
      #     use-quiet-mode: 'yes'
      #     use-verbose-mode: 'no'
      #     config-file: '.github/mlc_config.json'
  
  # License and dependency checks
  compliance:
    name: License & Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      
      # Run with the Go installed above from go.mod: golang/govulncheck-action sets go-version to
      # "stable" by default, which wins over go-version-file (see security.yml).
      - name: Check for vulnerable dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

